[package]
name = "wingine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
# `error-send` keeps `wingine::Error` `Send + Sync` when it wraps Lua errors.
mlua = { version = "0.12.2", features = ["luau-jit", "error-send"] }
pollster = "1.0.1"
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30"

[dev-dependencies]
env_logger = "0.11.11"

# Run the example's tests, which drive it headlessly, with `cargo test`.
[[example]]
name = "sprites"
test = true

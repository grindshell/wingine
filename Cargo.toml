[workspace]
members = [
    "crates/wingine-abi",
    "crates/wingine-editor",
    "crates/wingine-native",
    "examples/native-danmaku",
    "examples/native-particles",
]
# `cargo build`, `test` and `clippy` cover the whole workspace, not just the engine.
default-members = [
    ".",
    "crates/wingine-abi",
    "crates/wingine-editor",
    "crates/wingine-native",
    "examples/native-danmaku",
    "examples/native-particles",
]

[package]
name = "wingine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# `cargo run -- path/to/game` runs a game, though the editor's package has a binary too.
default-run = "wingine"

[features]
default = ["egui", "models", "physics"]
# egui interfaces drawn over games: debug panels, and tools such as the editor.
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Model files, glTF 2.0, for drawing in 3D views.
models = ["dep:gltf"]
# Physics by Rapier: collision in 2D, with characters that slide along colliders, and in 3D
# views, bodies that fall and tumble, and characters that walk among them. Meshes keep their
# triangles on the CPU for it.
physics = ["dep:rapier2d", "dep:rapier3d"]

[dependencies]
# TrueType and OpenType fonts, rasterized as text first needs their glyphs.
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", optional = true, default-features = false }
egui-winit = { version = "0.37.0", optional = true, default-features = false }
# Gamepads: Windows Gaming Input on Windows, evdev (through libudev) on Linux, IOKit on macOS, and
# the Gamepad API on the web.
gilrs = "0.11.2"
# Without its `import` feature, which would bring a JPEG decoder: the engine reads buffers and
# PNG textures itself.
gltf = { version = "1.4.1", optional = true, default-features = false, features = ["KHR_texture_transform", "names", "utils"] }
image ={ version = "0.25.10", default-features = false, features = ["png"] }
# Only the formats the engine documents: WAV (PCM) and OGG Vorbis.
kira = { version = "0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }
# Luau's `exact` table: math in Rust, the same bits on every platform, unlike the C library's.
libm = "0.2.16"
log = "0.4.34"
# `error-send` keeps `wingine::Error` `Send + Sync` when it wraps Lua errors. No release builds
# Luau for the web yet, so a build for it patches in mlua's master branch: see `docs/web.md`.
mlua = { version = "0.12.2", features = ["luau", "error-send"] }
pollster = "1.0.1"
# With `enhanced-determinism`, it moves things the same to the bit on every platform, as `exact`
# does: without, its results differ between Windows and Linux.
rapier2d = { version = "0.36.1", optional = true, features = ["enhanced-determinism"] }
rapier3d = { version = "0.36.1", optional = true, features = ["enhanced-determinism"] }
thiserror = "2.0.21"
wgpu = "30.0.1"
# `Instant`: `std`'s, except on the web, where `std`'s panics.
web-time = "1.1.0"
wingine-abi = { path = "crates/wingine-abi" }
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37.0", optional = true, default-features = false, features = ["clipboard", "wayland", "x11"] }
libloading = "0.8.9"
# Luau's native code generation, which WebAssembly can't run.
mlua = { version = "0.12.2", features = ["luau-jit"] }

# On the web: a canvas in the page, WebGPU, and saves in the browser's local storage. The page
# has one thread, so wgpu's types may claim to be `Send` and `Sync` there, as the engine's
# statics need them to be.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Storage", "Window"] }

[dev-dependencies]
env_logger = "0.11.11"
# Native libraries for the runtime's tests, linked into them rather than loaded from files.
wingine-native = { path = "crates/wingine-native" }

# Runs games written in Luau: `cargo run -- examples/pong`.
[[bin]]
name = "wingine"
path = "src/main.rs"
# Its docs would overwrite the library's, which has the same name.
doc = false

# Run the examples' tests, which drive them headlessly, with `cargo test`.
[[example]]
name = "sprites"
test = true

[[example]]
name = "meshes"
test = true
required-features = ["models"]

[[example]]
name = "gui"
required-features = ["egui"]

[[test]]
name = "gui"
required-features = ["egui"]

# What drawing a sprite costs from Rust, Luau and native libraries: `cargo bench`.
[[bench]]
name = "drawing"
harness = false

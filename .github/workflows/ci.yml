name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal, kira's audio output, links against ALSA on Linux, and gilrs, which reads gamepads,
      # against libudev.
      - name: Install ALSA and udev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The engine builds without egui too.
      - run: cargo clippy -p wingine --no-default-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runners have no GPU, so screenshot tests render with software adapters.
          # lavapipe: Mesa's software Vulkan driver.
          - os: ubuntu-latest
            wgpu_backend: vulkan
            luau_lsp: linux-x86_64
            exe: ""
          # WARP: the software DX12 adapter that ships with Windows.
          - os: windows-latest
            wgpu_backend: dx12
            luau_lsp: win64
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
      # The Luau language server the editor's Script screen runs, which its tests check it with.
      LUAU_LSP_VERSION: 1.70.1
      # Use the DX12 shader compiler built into Windows rather than whatever dxcompiler.dll is on
      # PATH; some builds of it crash on WARP.
      WGPU_DX12_COMPILER: fxc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runners have no sound device either, so audio falls back to silent output.
      - name: Install lavapipe, and ALSA and udev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev
      # With WINGINE_LUAU_LSP set, the tests that need luau-lsp fail rather than skip without it.
      - name: Install luau-lsp
        shell: bash
        run: |
          curl -sSfL -o luau-lsp.zip \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-${{ matrix.luau_lsp }}.zip"
          mkdir -p "$RUNNER_TEMP/luau-lsp"
          unzip -q luau-lsp.zip -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp${{ matrix.exe }}"
          echo "WINGINE_LUAU_LSP=$RUNNER_TEMP/luau-lsp/luau-lsp${{ matrix.exe }}" >> "$GITHUB_ENV"
      - run: cargo test
      - name: Upload screenshot mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}
          # Engine tests' mismatches, and the frames Luau tests' failures name.
          path: |
            target/tmp/screenshots/
            examples/*/.test-output/
          include-hidden-files: true
          if-no-files-found: ignore
